<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Show Tracker — Vancouver Island</title>
<meta name="description" content="A live music event aggregator for Vancouver Island, the Gulf Islands, and the Sunshine Coast. Hundreds of upcoming shows pulled from local venue and community listings, in a calendar or list view, filterable by city." />
<link rel="canonical" href="https://mrtransistor.ca/projects/live-shows/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Mr. Transistor" />
<meta property="og:title" content="Live Show Tracker" />
<meta property="og:description" content="A live music event aggregator for Vancouver Island, the Gulf Islands, and the Sunshine Coast. Hundreds of upcoming shows pulled from local venue and community listings, in a calendar or list view, filterable by city." />
<meta property="og:url" content="https://mrtransistor.ca/projects/live-shows/" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="mask-icon" href="/favicon.svg" color="#1c1c1c" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="home-link" href="/" aria-label="Back to Mr. Transistor home">
    <span class="home-arrow" aria-hidden="true">←</span>
    <span class="wordmark">Mr. Transistor</span>
  </a>
  <span class="header-divider" aria-hidden="true"></span>
  <span class="logo">Live Show Tracker</span>
  <!-- Filter pills scroll horizontally; the view toggle is pinned outside that
       scroll region so it stays reachable on narrow viewports. -->
  <div class="header-actions">
    <div class="city-filter" id="city-filter"></div>
  </div>
  <div class="view-toggle">
    <button class="toggle-btn active" id="btn-cal" data-view="cal">Cal</button>
    <button class="toggle-btn" id="btn-list" data-view="list">List</button>
    <button class="toggle-btn" id="btn-map" data-view="map">Map</button>
  </div>
</header>

<!-- Calendar view -->
<div id="cal-view" class="main-view active">
  <div class="week-col-headers">
    <div class="wch-cell">Mon</div>
    <div class="wch-cell">Tue</div>
    <div class="wch-cell">Wed</div>
    <div class="wch-cell">Thu</div>
    <div class="wch-cell weekend">Fri</div>
    <div class="wch-cell weekend">Sat</div>
    <div class="wch-cell weekend">Sun</div>
  </div>
  <div id="cal-body"></div>
</div>

<!-- List view -->
<div id="list-view" class="main-view">
  <div id="list-body"></div>
</div>

<!-- Map view -->
<div id="map-view" class="main-view">
  <div class="map-placeholder">
    <div class="map-placeholder-inner">
      <div class="map-icon">◉</div>
      <div class="map-label">Map view coming soon</div>
      <div class="map-sub">Will show events for the date range you're viewing</div>
    </div>
  </div>
</div>

<!-- Day detail panel -->
<div id="day-panel" class="day-panel" aria-hidden="true">
  <div class="day-panel-header">
    <button class="day-back-btn" id="day-back">← Calendar</button>
    <div class="day-nav-group">
      <button class="day-nav-btn" id="day-prev">‹ Prev</button>
      <span class="day-panel-title" id="day-panel-title"></span>
      <button class="day-nav-btn" id="day-next">Next ›</button>
    </div>
    <button class="day-close-btn" id="day-close">✕</button>
  </div>
  <div class="bubble-grid" id="bubble-grid"></div>
</div>

<script src="app.js"></script>
</body>
</html>
